<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PLAYER 华流 · CAPTURA</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #f5f5f7;
    font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    background: #000;
    pointer-events: none;
    opacity: 0;
    transform-origin: center center;
  }
  #empty {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0f;
    text-align: center;
    padding: 28px;
  }
  #empty.hidden { display: none; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(254,44,85,.2);
    color: #fe2c55;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: #fe2c55; }
</style>
</head>
<body>
<video id="mainA" playsinline muted></video>
<video id="overlayA" playsinline muted></video>
<video id="mainB" playsinline muted></video>
<video id="overlayB" playsinline muted></video>
<div id="empty">
  <div>
    <span class="pill"><span class="dot"></span>直播素材</span>
    <p style="font-size:26px;font-weight:700;margin:14px 0 8px">华流LIVE 播放器</p>
    <p style="color:#a8a8b3;font-size:14px">Aguardando o console. Clique em Começar na outra janela.</p>
    <p style="color:#6e6e7a;font-size:11px;margin-top:18px;letter-spacing:.04em">PLAYER 华流 · CAPTURA</p>
  </div>
</div>
<script>
(function () {
  try {
    if (window.opener) window.resizeTo(540, 960);
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => (b <= a ? a : a + Math.random() * (b - a));
  const ordered = (a, b) => (a <= b ? [a, b] : [b, a]);
  const mains = [$("mainA"), $("mainB")];
  const overlays = [$("overlayA"), $("overlayB")];

  let cfg = {
    mute: true, randomStart: true, avoidRepeat: true, overlayEnabled: true,
    clipMin: 12, clipMax: 28, zoomMin: 112, zoomMax: 115,
    moveMin: 4, moveMax: 9, overlayChance: 45, overlayOpacity: 35,
  };
  let playlist = [];
  let running = false, paused = false, activeSlot = -1, lastMainId = null;
  let slotMain = [null, null];
  let overlayTarget = [0, 0];
  let opening = [false, false];
  let sceneTimer = 0, moveTimer = 0, watchdog = 0;
  const urls = [];
  const demoStops = [];

  function emit(status) {
    try {
      ch.postMessage({ t: "status", status: status, running: running, paused: paused, fileName: lastMainId });
    } catch (e) {}
  }

  function stopMedia(el) {
    try { el.pause(); } catch (e) {}
    el.style.opacity = "0";
    el.removeAttribute("src");
    el.srcObject = null;
    try { el.load(); } catch (e) {}
  }

  function pick(avoidId, avoidAlso) {
    if (!playlist.length) return null;
    if (playlist.length === 1) return playlist[0];
    for (let i = 0; i < 50; i++) {
      const item = playlist[Math.floor(Math.random() * playlist.length)];
      const blocked = cfg.avoidRepeat && item.id === avoidId;
      if (!blocked && item.id !== avoidAlso) return item;
    }
    return playlist[0];
  }

  function load(el, item) {
    el.style.opacity = "0";
    if (item.stream) {
      el.removeAttribute("src");
      el.srcObject = item.stream;
    } else {
      el.srcObject = null;
      el.src = item.url;
    }
    el.muted = true;
    el.playsInline = true;
    el.loop = !!item.stream;
    el.play().catch(function () {});
  }

  function applyTransform(el, animate) {
    const w = window.innerWidth || 540;
    const h = window.innerHeight || 960;
    let zoom = Number(el.dataset.zoom || 0);
    if (!animate || !zoom) {
      const [z0, z1] = ordered(Math.max(cfg.zoomMin, 112), Math.max(cfg.zoomMax, 112));
      zoom = Math.max(1.12, rand(z0, z1) / 100);
      el.dataset.zoom = String(zoom);
    }
    const maxX = ((zoom - 1) / 2) * w * 0.65;
    const maxY = ((zoom - 1) / 2) * h * 0.65;
    const x = rand(-maxX, maxX), y = rand(-maxY, maxY);
    const [m0, m1] = ordered(cfg.moveMin, cfg.moveMax);
    const dur = rand(m0, m1);
    el.style.transition = animate ? "transform " + dur + "s ease-in-out" : "none";
    el.style.transform = "translate(" + x + "px," + y + "px) scale(" + zoom + ")";
    return dur;
  }

  function prepareOverlay(slot, main) {
    const overlay = overlays[slot];
    const use = cfg.overlayEnabled && playlist.length > 1 && Math.random() * 100 < cfg.overlayChance;
    if (!use) { stopMedia(overlay); overlayTarget[slot] = 0; return; }
    const item = pick(null, main.id);
    if (!item) { stopMedia(overlay); return; }
    overlayTarget[slot] = rand(0.12, cfg.overlayOpacity / 100);
    overlay.muted = true;
    applyTransform(overlay, false);
    load(overlay, item);
  }

  function switchScene() {
    if (!running || paused || !playlist.length) return;
    const nextSlot = activeSlot === 0 ? 1 : 0;
    const item = pick(lastMainId);
    if (!item) return;
    slotMain[nextSlot] = item;
    opening[nextSlot] = true;
    prepareOverlay(nextSlot, item);
    const main = mains[nextSlot];
    main.muted = cfg.mute;
    applyTransform(main, false);
    main.style.zIndex = 20;
    overlays[nextSlot].style.zIndex = 21;
    if (activeSlot >= 0) {
      mains[activeSlot].style.zIndex = 10;
      overlays[activeSlot].style.zIndex = 11;
    }
    emit("Preparando：" + item.name);
    load(main, item);
  }

  function activateSlot(slot) {
    if (!running || !opening[slot]) return;
    opening[slot] = false;
    const main = mains[slot], overlay = overlays[slot], item = slotMain[slot], old = activeSlot;
    if (cfg.randomStart && main.duration > 4) main.currentTime = rand(0, Math.max(0, main.duration - 2));
    main.muted = cfg.mute;
    main.play();
    main.style.opacity = "1";
    if (overlay.src || overlay.srcObject) {
      if (cfg.randomStart && overlay.duration > 4) overlay.currentTime = rand(0, Math.max(0, overlay.duration - 2));
      overlay.muted = true;
      overlay.play();
      overlay.style.opacity = String(overlayTarget[slot]);
    }
    activeSlot = slot;
    lastMainId = item ? item.id : null;
    if (old >= 0 && old !== slot) { stopMedia(mains[old]); stopMedia(overlays[old]); }
    $("empty").classList.add("hidden");
    emit("Reproduzindo · " + (item ? item.name : ""));
    scheduleMove();
    scheduleScene();
  }

  function scheduleScene() {
    clearTimeout(sceneTimer);
    const [a, b] = ordered(cfg.clipMin, cfg.clipMax);
    sceneTimer = setTimeout(switchScene, rand(a, b) * 1000);
  }
  function scheduleMove() {
    clearTimeout(moveTimer);
    if (!running || paused || activeSlot < 0) return;
    applyTransform(mains[activeSlot], true);
    const ov = overlays[activeSlot];
    if ((ov.src || ov.srcObject) && Number(ov.style.opacity) > 0) applyTransform(ov, true);
    const [a, b] = ordered(cfg.moveMin, cfg.moveMax);
    moveTimer = setTimeout(scheduleMove, rand(a, b) * 1000);
  }

  function start() {
    if (!playlist.length) return;
    running = true; paused = false; activeSlot = -1; lastMainId = null;
    clearInterval(watchdog);
    watchdog = setInterval(function () {
      if (!running || paused || activeSlot < 0) return;
      mains[activeSlot].play().catch(function () {});
      const ov = overlays[activeSlot];
      if (ov.src || ov.srcObject) ov.play().catch(function () {});
    }, 2000);
    switchScene();
  }
  function pause() {
    if (!running) return;
    paused = true; clearTimeout(sceneTimer); clearTimeout(moveTimer);
    mains.concat(overlays).forEach(function (el) { try { el.pause(); } catch (e) {} });
    emit("Pausado");
  }
  function resume() {
    if (!running) return;
    paused = false;
    if (activeSlot >= 0) {
      mains[activeSlot].play();
      const ov = overlays[activeSlot];
      if (ov.src || ov.srcObject) ov.play();
    } else switchScene();
    scheduleMove(); scheduleScene();
    emit("Reproduzindo");
  }
  function stop() {
    running = false; paused = false;
    clearTimeout(sceneTimer); clearTimeout(moveTimer); clearInterval(watchdog);
    opening = [false, false];
    mains.concat(overlays).forEach(stopMedia);
    activeSlot = -1;
    $("empty").classList.remove("hidden");
    emit("Parado");
  }

  mains.forEach(function (el, i) {
    el.addEventListener("loadeddata", function () { if (opening[i]) activateSlot(i); });
    el.addEventListener("ended", function () { if (running && !paused) switchScene(); });
    el.addEventListener("error", function () { if (running) switchScene(); });
  });
  overlays.forEach(function (el, i) {
    el.addEventListener("loadeddata", function () {
      if (activeSlot === i && running && !paused) {
        el.play();
        el.style.opacity = String(overlayTarget[i]);
      }
    });
  });

  function clearUrls() {
    urls.forEach(function (u) { URL.revokeObjectURL(u); });
    urls.length = 0;
    demoStops.forEach(function (fn) { fn(); });
    demoStops.length = 0;
  }

  function setFiles(files) {
    stop();
    clearUrls();
    playlist = files.map(function (file, i) {
      const url = URL.createObjectURL(file);
      urls.push(url);
      return { id: file.name + "-" + file.size + "-" + i, name: file.name, url: url };
    });
  }

  function makeDemo(label, hue, seed) {
    const canvas = document.createElement("canvas");
    canvas.width = 720; canvas.height = 1280;
    const ctx = canvas.getContext("2d", { alpha: false });
    let t = seed * 40;
    const draw = function () {
      t += 1;
      const w = canvas.width, h = canvas.height;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "hsl(" + hue + " 28% 8%)");
      g.addColorStop(0.45, "hsl(" + ((hue + 12) % 360) + " 40% 14%)");
      g.addColorStop(1, "hsl(" + hue + " 22% 6%)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 5; i++) {
        const px = w * (0.2 + 0.15 * i) + Math.sin(t * 0.01 + i) * 40;
        const py = h * (0.25 + 0.12 * i) + Math.cos(t * 0.008 + i * 1.3) * 60;
        const r = 90 + i * 36;
        const orb = ctx.createRadialGradient(px, py, 8, px, py, r);
        orb.addColorStop(0, "hsla(" + ((hue + i * 18) % 360) + " 80% 62% / 0.55)");
        orb.addColorStop(1, "hsla(0 0% 0% / 0)");
        ctx.fillStyle = orb; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    };
    draw();
    const timer = setInterval(draw, 1000 / 24);
    const stream = canvas.captureStream(24);
    demoStops.push(function () { clearInterval(timer); stream.getTracks().forEach(function (tr) { tr.stop(); }); });
    return { id: "demo-" + seed, name: label, stream: stream };
  }

  function runDemo() {
    stop(); clearUrls();
    playlist = [makeDemo("素材 01  ·  seda", 350, 1), makeDemo("素材 02  ·  ouro", 28, 2), makeDemo("素材 03  ·  noite", 210, 3)];
    start();
  }

  const ch = new BroadcastChannel("hualiu-live-v1");
  ch.onmessage = function (ev) {
    const msg = ev.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "settings" && msg.settings) cfg = Object.assign(cfg, msg.settings);
    if (msg.t === "cmd") {
      if (msg.cmd === "demo") runDemo();
      if (msg.cmd === "start") start();
      if (msg.cmd === "pause") pause();
      if (msg.cmd === "resume") resume();
      if (msg.cmd === "next" && running && !paused) switchScene();
      if (msg.cmd === "stop") stop();
    }
  };
  ch.postMessage({ t: "ready" });
  ch.postMessage({ t: "capture-open" });

  window.addEventListener("message", function (ev) {
    const data = ev.data;
    if (!data || data.t !== "files" || !data.files || !data.files.length) return;
    setFiles(data.files);
    try { ch.postMessage({ t: "files-ok", count: data.files.length }); } catch (e) {}
    if (data.autoplay) start();
  });

  window.addEventListener("beforeunload", function () {
    try { ch.postMessage({ t: "capture-closed" }); } catch (e) {}
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (paused) resume(); else if (running) pause();
    }
    if (e.key === "ArrowRight") { e.preventDefault(); if (running && !paused) switchScene(); }
    if (e.key === "F11") {
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });

  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    const files = [].slice.call(e.dataTransfer.files).filter(function (f) { return f.type.indexOf("video/") === 0; });
    if (files.length) { setFiles(files); start(); }
  });
})();
</script>
</body>
</html>
